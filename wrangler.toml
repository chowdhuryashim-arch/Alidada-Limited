name = "alidada"
main = "src/index.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The Worker runs before every static file (including the app shell) so the
# session check always happens first. html_handling = "none" stops the assets
# layer from issuing clean-URL redirects that would fight the auth middleware.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
COMPANY_NAME = "ALIDADA Limited"

[[d1_databases]]
binding = "DB"
database_name = "alidada-ledger-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Document / voucher attachments. Remove this block if R2 is not enabled on the
# Cloudflare account — the app keeps working and simply hides document upload.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "alidada-ledger-docs"

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   SESSION_SECRET — HMAC key for signing session cookies (long random string)
#   BOOTSTRAP_KEY  — one-time key required on /setup to create the first Admin
